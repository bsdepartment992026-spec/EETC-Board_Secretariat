<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المستخدمون — نظام دورة العمل</title>
<style>
  body { font-family:'Segoe UI', Tahoma, sans-serif; background:#f5f6f8; margin:0; padding:24px 16px; }
  .wrap { max-width:640px; margin:0 auto; }
  .back { color:#1a73e8; text-decoration:none; font-size:13px; }
  h1 { font-size:20px; margin:10px 0 18px; }
  .card { background:#fff; border-radius:10px; padding:20px; margin-bottom:18px;
          box-shadow:0 2px 8px rgba(0,0,0,.06); }
  .card h2 { font-size:16px; margin:0 0 14px; }
  label { display:block; font-size:13px; color:#555; margin:10px 0 4px; }
  input, select { width:100%; padding:9px; border:1px solid #ccc; border-radius:6px;
                  font-family:inherit; box-sizing:border-box; }
  .perm-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin-top:8px; }
  @media (max-width:480px) { .perm-grid { grid-template-columns:1fr; } }
  .perm-item { display:flex; align-items:center; gap:6px; font-size:13px; }
  button { background:#1a73e8; color:#fff; border:none; padding:10px 20px; border-radius:6px;
           cursor:pointer; font-size:14px; margin-top:16px; }
  button:disabled { background:#aaa; }
  .user-row { padding:12px 0; border-bottom:1px solid #f0f0f0; }
  .user-row .name { font-weight:600; font-size:14px; }
  .user-row .perms { font-size:12px; color:#888; margin-top:4px; }
  .user-row .actions { margin-top:8px; }
  .user-row button { margin:0 6px 0 0; padding:5px 12px; font-size:12px; }
  .danger { background:#fdecea !important; color:#c0392b !important; }
  .secondary { background:#eee !important; color:#333 !important; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333;
           color:#fff; padding:10px 20px; border-radius:6px; display:none; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">→ الرئيسية</a>
  <h1>المستخدمون والصلاحيات</h1>

  <div class="card">
    <h2>إضافة مستخدم جديد</h2>
    <label>الاسم الكامل</label>
    <input id="fullName">
    <label>اسم المستخدم (لتسجيل الدخول)</label>
    <input id="username">
    <label>كلمة سر مبدئية</label>
    <input id="password" type="password">
    <label>تقييد الحساب بجهة معينة (اختياري — لموظفي المتابعة)</label>
    <select id="orgScope"><option value="">بدون تقييد</option></select>

    <label>الصلاحيات</label>
    <div class="perm-grid" id="permGrid"></div>

    <button id="addBtn" onclick="addUser()">إضافة المستخدم</button>
  </div>

  <div class="card">
    <h2>المستخدمون الحاليون</h2>
    <div id="userList">جارٍ التحميل...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/api.js"></script>
<script>
API.requireLogin();
if (!API.hasPermission('ManageUsers')) {
  alert('ليس لديك صلاحية الوصول لهذه الصفحة');
  window.location.href = 'index.html';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

let PERMISSIONS = [];

async function loadPermissionsGrid() {
  PERMISSIONS = await API.call('listPermissionsCatalog');
  document.getElementById('permGrid').innerHTML = PERMISSIONS.map(p => `
    <label class="perm-item">
      <input type="checkbox" value="${p.key}" class="permCheckbox">
      ${p.label}
    </label>`).join('');
}

async function loadOrgs() {
  const orgs = await API.call('listOrganizations');
  document.getElementById('orgScope').innerHTML += orgs.map(o => `<option value="${o.OrgID}">${o.Name}</option>`).join('');
}

function permLabel(key) {
  const p = PERMISSIONS.find(x => x.key === key);
  return p ? p.label : key;
}

async function loadUsers() {
  const users = await API.call('listUsers');
  document.getElementById('userList').innerHTML = users.map(u => `
    <div class="user-row">
      <div class="name">${u.FullName} <span style="color:#888;font-weight:normal;">(${u.Username})</span></div>
      <div class="perms">${u.Permissions.map(permLabel).join(' · ') || 'لا توجد صلاحيات'}</div>
      <div class="actions">
        <button class="secondary" onclick="resetPassword('${u.UserID}')">إعادة تعيين كلمة السر</button>
        <button class="danger" onclick="deactivate('${u.UserID}')">تعطيل الحساب</button>
      </div>
    </div>`).join('') || '<p>لا يوجد مستخدمون.</p>';
}

async function addUser() {
  const FullName = document.getElementById('fullName').value.trim();
  const Username = document.getElementById('username').value.trim();
  const Password = document.getElementById('password').value;
  const OrgScope = document.getElementById('orgScope').value;
  const Permissions = Array.from(document.querySelectorAll('.permCheckbox:checked')).map(c => c.value);

  if (!FullName || !Username || !Password) { toast('املأ كل الحقول الأساسية'); return; }
  if (Password.length < 6) { toast('كلمة السر قصيرة، لازم 6 أحرف على الأقل'); return; }

  const btn = document.getElementById('addBtn');
  btn.disabled = true; btn.textContent = 'جارٍ الإضافة...';
  try {
    await API.call('addUser', { FullName, Username, Password, OrgScope, Permissions });
    toast('تم إضافة المستخدم بنجاح');
    document.getElementById('fullName').value = '';
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    document.querySelectorAll('.permCheckbox').forEach(c => c.checked = false);
    loadUsers();
  } catch (e) {
    toast('خطأ: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'إضافة المستخدم';
  }
}

async function resetPassword(userId) {
  const newPass = prompt('اكتب كلمة السر الجديدة لهذا المستخدم (6 أحرف على الأقل):');
  if (!newPass || newPass.length < 6) return;
  await API.call('resetUserPassword', { UserID: userId, NewPassword: newPass });
  toast('تم تغيير كلمة السر');
}

async function deactivate(userId) {
  if (!confirm('تعطيل هذا الحساب؟ لن يستطيع صاحبه تسجيل الدخول بعدها.')) return;
  await API.call('toggleUserActive', { UserID: userId, IsActive: false });
  toast('تم تعطيل الحساب');
  loadUsers();
}

loadPermissionsGrid();
loadOrgs();
loadUsers();
</script>
</body>
</html>
