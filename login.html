<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول — نظام دورة العمل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Markazi+Text:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1B2A41; --paper:#F3F4F6; --accent:#A6802E; --line:#E2E5EA; }
  * { box-sizing:border-box; }
  body { font-family:'Cairo', sans-serif; background:var(--paper); margin:0;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { background:#fff; border-radius:6px; padding:36px 32px; width:100%; max-width:380px;
          border:1px solid var(--line); box-shadow:0 8px 24px rgba(27,42,65,.08); }
  .brand { text-align:center; margin-bottom:26px; }
  .brand .mark { width:42px; height:42px; border-radius:50%; background:var(--accent); color:#fff;
                 display:flex; align-items:center; justify-content:center; margin:0 auto 10px;
                 font-family:'Markazi Text', serif; font-weight:700; font-size:20px; }
  h1 { font-family:'Markazi Text', serif; font-weight:700; font-size:21px; color:var(--ink); margin:0; }
  .brand p { color:#6B7686; font-size:12.5px; margin:4px 0 0; }
  label { display:block; font-size:13px; color:#4B5768; margin:16px 0 6px; font-weight:500; }
  input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:5px;
          font-family:inherit; font-size:14px; background:var(--paper); }
  input:focus { outline:none; border-color:var(--accent); background:#fff; }
  button { width:100%; background:var(--ink); color:#fff; border:none; padding:12px; border-radius:5px;
           cursor:pointer; font-size:14.5px; font-weight:600; margin-top:24px; font-family:inherit; }
  button:hover { background:#0F1A2C; }
  button:disabled { background:#9AA3AF; }
  .error { color:#B3261E; font-size:13px; margin-top:14px; text-align:center; display:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="mark">ب</div>
      <h1>نظام دورة العمل</h1>
      <p>الإدارة العامة لمجلس الإدارة</p>
    </div>
    <label>اسم المستخدم</label>
    <input id="username" autofocus>
    <label>كلمة السر</label>
    <input id="password" type="password">
    <button id="btn" onclick="doLogin()">دخول</button>
    <div class="error" id="err"></div>
  </div>

<script src="js/api.js"></script>
<script>
if (API.getToken()) window.location.href = 'index.html';

async function doLogin() {
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  err.style.display = 'none';
  const Username = document.getElementById('username').value.trim();
  const Password = document.getElementById('password').value;
  if (!Username || !Password) return;

  btn.disabled = true; btn.textContent = 'جارٍ الدخول...';
  try {
    const result = await API.call('login', { Username, Password });
    API.setSession(result.token, result.user);
    window.location.href = 'index.html';
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'دخول';
  }
}
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
