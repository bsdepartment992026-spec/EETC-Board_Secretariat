<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المذكرات — نظام دورة العمل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Markazi+Text:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1B2A41; --ink-soft:#4B5768; --paper:#F3F4F6; --surface:#fff;
          --accent:#A6802E; --line:#E2E5EA; --success:#1F7A4D; }
  * { box-sizing:border-box; }
  body { font-family:'Cairo', sans-serif; background:var(--paper); margin:0; color:var(--ink); }
  .wrap { max-width:980px; margin:0 auto; padding:24px; }
  h1 { font-family:'Markazi Text', serif; font-size:22px; margin:18px 0 14px; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:20px; margin-bottom:20px; }
  .panel h2 { font-family:'Markazi Text', serif; font-size:18px; margin:0 0 14px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:520px) { .row2 { grid-template-columns:1fr; } }
  label { display:block; font-size:12.5px; color:var(--ink-soft); margin:12px 0 5px; font-weight:500; }
  input, select, textarea { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:5px;
                             font-family:inherit; font-size:13.5px; box-sizing:border-box; background:#fff; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); }
  textarea { min-height:60px; resize:vertical; }
  button { background:var(--ink); color:#fff; border:none; padding:10px 22px; border-radius:5px;
           cursor:pointer; font-size:13.5px; font-weight:600; margin-top:18px; font-family:inherit; }
  button:hover { background:#0F1A2C; }
  button:disabled { background:#9AA3AF; cursor:default; }
  button.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
  button.secondary:hover { background:var(--paper); }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink);
           color:#fff; padding:10px 20px; border-radius:5px; font-size:13px; display:none; z-index:10; }
  .hint { font-size:11.5px; color:var(--ink-soft); margin-top:4px; }

  @media (max-width:520px) {
    .wrap { padding:16px 14px; }
    .panel { padding:16px; }
    button { width:100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><div class="brand">📄 المذكرات</div><div class="top-nav"></div></div>
  <h1>تسجيل مذكرة واردة</h1>

  <div class="panel">
    <h2>بيانات المذكرة</h2>

    <label>الموضوع</label>
    <input id="subject" placeholder="موضوع المذكرة">

    <label>الجهة صاحبة المذكرة</label>
    <select id="orgSelect"><option value="">جارٍ التحميل...</option></select>

    <div class="row2">
      <div>
        <label>تاريخ الوارد</label>
        <input type="date" id="incomingDate">
      </div>
      <div>
        <label>ساعة الاستلام</label>
        <input type="time" id="receiptTime">
      </div>
    </div>

    <div class="row2">
      <div>
        <label>رقم صادر رئيس مجلس الإدارة (اختياري)</label>
        <input id="chairmanNo" placeholder="مثال: 24">
      </div>
      <div>
        <label>تاريخ صادر رئيس مجلس الإدارة (اختياري)</label>
        <input type="date" id="chairmanDate">
      </div>
    </div>

    <div class="row2">
      <div>
        <label>رقم قرار لجنة البت (اختياري)</label>
        <input id="bidCommDecNo" placeholder="مثال: ١/٢٠٢٦">
      </div>
      <div>
        <label>رقم جلسة لجنة البت (اختياري)</label>
        <input id="bidCommSessNo" placeholder="مثال: ٥">
      </div>
    </div>
    <div class="row2">
      <div>
        <label>تاريخ جلسة لجنة البت (اختياري)</label>
        <input type="date" id="bidCommSessDate">
      </div>
      <div></div>
    </div>

    <label>ملاحظات (اختياري)</label>
    <textarea id="notes"></textarea>

    <label>نسخة ممسوحة ضوئيًا من المذكرة (اختياري الآن، يمكن إضافتها لاحقًا)</label>
    <input type="file" id="scanFile" accept=".pdf,.jpg,.jpeg,.png">

    <button id="saveBtn" onclick="saveMemo()">حفظ المذكرة</button>
    <button id="updateBtn" class="secondary" onclick="updateMemo()" style="display:none">تحديث المذكرة</button>
    <button id="cancelEditBtn" class="secondary" onclick="cancelEdit()" style="display:none">إلغاء التعديل</button>
    <button id="insertBtn" class="secondary" onclick="saveAndInsert()" style="display:none">إدراج المذكرة في الجلسة الحالية</button>
  <div class="panel">
      <h2>قائمة المذكرات السابقة</h2>
      <div class="row2" style="margin-bottom:12px">
        <input id="memoSearch" placeholder="بحث عن موضوع / جهة / رقم قرار لجنة البت / رقم جلسة لجنة البت">
        <select id="memoStatus" onchange="renderMemos()">
          <option value="">الكل</option>
          <option value="Available">متاحة</option>
          <option value="InRoll">مدرجة في رل</option>
          <option value="Decided">صدر لها قرار</option>
        </select>
      </div>
      <div class="table-wrap" style="overflow:auto">
        <table class="memos-table" style="width:100%;border-collapse:collapse;font-size:12.5px">
          <thead>
            <tr style="background:#F3F4F6">
              <th style="text-align:right;padding:8px;border:1px solid var(--line)">رقم المذكرة</th>
              <th style="text-align:right;padding:8px;border:1px solid var(--line)">تاريخ الوارد</th>
              <th style="text-align:right;padding:8px;border:1px solid var(--line)">الجهة</th>
              <th style="text-align:right;padding:8px;border:1px solid var(--line)">الموضوع</th>
              <th style="text-align:right;padding:8px;border:1px solid var(--line)">قرار لجنة البت</th>
              <th style="text-align:right;padding:8px;border:1px solid var(--line)">جلسة لجنة البت</th>
              <th style="text-align:center;padding:8px;border:1px solid var(--line)">تعديل</th>
            </tr>
          </thead>
          <tbody id="memosBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/api.js"></script>
<script src="js/arabic.js"></script>
<script src="js/nav.js"></script>
<script>
API.requireLogin();
renderTopNav('memos');
if (!API.hasPermission('ManageMemos')) {
  alert('ليس لديك صلاحية الوصول لهذه الصفحة');
  window.location.href = 'index.html';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 2600);
}

async function loadOrganizations() {
  const orgs = await API.call('listOrganizations');
  const sel = document.getElementById('orgSelect');
  sel.innerHTML = '<option value="">اختر الجهة...</option>' +
    orgs.map(o => `<option value="${o.OrgID}">${o.Name}</option>`).join('');
  if (!orgs.length) sel.innerHTML = '<option value="">لا توجد جهات — أضِفها من الإعدادات أولًا</option>';
}

const MAX_FILE_MB = 15;

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    if (file.size > MAX_FILE_MB * 1024 * 1024) {
      reject(new Error(`الملف كبير جدًا (${(file.size / 1024 / 1024).toFixed(1)} ميجا). الحد الأقصى ${MAX_FILE_MB} ميجا حاليًا.`));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = () => reject(new Error('تعذّرت قراءة الملف من جهازك. جرّب ملفًا آخر.'));
    reader.readAsDataURL(file);
  });
}

function collectMemoPayload() {
  const subject = document.getElementById('subject').value.trim();
  const orgId = document.getElementById('orgSelect').value;
  if (!subject) { toast('اكتب موضوع المذكرة أولًا'); return null; }
  if (!orgId) { toast('اختر الجهة صاحبة المذكرة'); return null; }
  return {
    Subject: subject,
    OrganizationID: orgId,
    IncomingDate: document.getElementById('incomingDate').value,
    ReceiptTime: document.getElementById('receiptTime').value,
    BidCommitteeDecisionNo: document.getElementById('bidCommDecNo').value.trim(),
    BidCommitteeSessionNo: document.getElementById('bidCommSessNo').value.trim(),
    BidCommitteeSessionDate: document.getElementById('bidCommSessDate').value,
    ChairmanOutgoingNo: document.getElementById('chairmanNo').value.trim(),
    ChairmanOutgoingDate: document.getElementById('chairmanDate').value,
    Notes: document.getElementById('notes').value.trim()
  };
}

async function withScanFile(payload) {
  const file = document.getElementById('scanFile').files[0];
  if (file) {
    payload.fileBase64 = await fileToBase64(file);
    payload.fileName = file.name;
    payload.mimeType = file.type || 'application/octet-stream';
  }
  return payload;
}

function clearMemoForm() {
  ['subject','incomingDate','receiptTime','chairmanNo','chairmanDate','bidCommDecNo','bidCommSessNo','bidCommSessDate','notes'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('scanFile').value = '';
  document.getElementById('saveBtn').style.display = 'inline-block';
  document.getElementById('updateBtn').style.display = 'none';
  document.getElementById('cancelEditBtn').style.display = 'none';
  delete window._editMemoId;
}

async function updateMemo() {
  const payload = collectMemoPayload();
  if (!payload || !window._editMemoId) return;
  payload.MemoID = window._editMemoId;
  const btn = document.getElementById('updateBtn');
  btn.disabled = true; btn.textContent = 'جارٍ التحديث...';
  try {
    await API.call('updateMemo', payload);
    toast('تم تحديث بيانات المذكرة ✅');
    clearMemoForm();
    await loadMemosList();
  } catch (e) {
    toast('خطأ: ' + (e && e.message ? e.message : 'حدث خطأ غير متوقع.'));
  } finally {
    btn.disabled = false; btn.textContent = 'تحديث المذكرة';
  }
}
function cancelEdit() { clearMemoForm(); }
let allMemos = [];
async function loadMemosList() {
  allMemos = await API.call('listMemos');
  renderMemos();
}
function renderMemos() {
  const body = document.getElementById('memosBody');
  if (!body) return;
  const q = (document.getElementById('memoSearch')||{}).value||'';
  const st = (document.getElementById('memoStatus')||{}).value||'';
  let list = allMemos.slice();
  if (st) list = list.filter(m=> (m.Status||'')===st);
  if (q) {
    const s = String(q).toLowerCase();
    list = list.filter(m=>{
      return [m.Subject,m.MemoID,m.BidCommitteeDecisionNo,m.BidCommitteeSessionNo,m.ChairmanOutgoingNo]
        .some(v=> String(v||'').toLowerCase().includes(s));
    });
  }
  body.innerHTML = list.length ? list.slice(0,200).map(m=>{
    return `<tr>
      <td style="border:1px solid var(--line);padding:6px">${m.MemoID}</td>
      <td style="border:1px solid var(--line);padding:6px">${m.IncomingDate||''}</td>
      <td style="border:1px solid var(--line);padding:6px">${m.OrgName||''}</td>
      <td style="border:1px solid var(--line);padding:6px">${m.Subject||''}</td>
      <td style="border:1px solid var(--line);padding:6px">${m.BidCommitteeDecisionNo||''}</td>
      <td style="border:1px solid var(--line);padding:6px">${m.BidCommitteeSessionNo||''}${m.BidCommitteeSessionDate ? (' / '+m.BidCommitteeSessionDate) : ''}</td>
      <td style="border:1px solid var(--line);padding:6px;text-align:center"><button class="secondary" style="margin:0;padding:4px 8px" onclick="editMemo('${m.MemoID}')">تعديل</button></td>
    </tr>`;
  }).join('') : `<tr><td colspan="7" style="border:1px solid var(--line);padding:8px;text-align:center">لا توجد مذكرات</td></tr>`;
}
async function editMemo(id){
  const m = allMemos.find(x=>x.MemoID===id);
  if(!m) return;
  document.getElementById('subject').value = m.Subject||'';
  document.getElementById('orgSelect').value = m.OrganizationID||'';
  document.getElementById('incomingDate').value = m.IncomingDate||'';
  document.getElementById('receiptTime').value = m.ReceiptTime||'';
  document.getElementById('chairmanNo').value = m.ChairmanOutgoingNo||'';
  document.getElementById('chairmanDate').value = m.ChairmanOutgoingDate||'';
  document.getElementById('bidCommDecNo').value = m.BidCommitteeDecisionNo||'';
  document.getElementById('bidCommSessNo').value = m.BidCommitteeSessionNo||'';
  document.getElementById('bidCommSessDate').value = m.BidCommitteeSessionDate||'';
  document.getElementById('notes').value = m.Notes||'';
  document.getElementById('scanFile').value = '';
  window._editMemoId = id;
  document.getElementById('saveBtn').style.display = 'none';
  document.getElementById('updateBtn').style.display = 'inline-block';
  document.getElementById('cancelEditBtn').style.display = 'inline-block';
  window.scrollTo({top:0,behavior:'smooth'});
}

async function saveAndInsert() {
  const payload = collectMemoPayload();
  if (!payload) return;
  const btn = document.getElementById('insertBtn');
  btn.disabled = true;
  btn.textContent = 'جارٍ الإدراج...';
  try {
    await withScanFile(payload);
    const saved = await API.call('addMemo', payload);
    const memoId = (saved && saved.memo) ? saved.memo.MemoID : '';

    const meetings = await API.call('listMeetings');
    if (!meetings || !meetings.length) {
      toast('تم حفظ المذكرة، لكن لا توجد جلسة حالية لإدراجها فيها — أدرجها لاحقًا من إجمالي المذكرات.');
      clearMemoForm();
      return;
    }
    const res = await API.call('addRollMemosBulk', { MeetingID: meetings[0].MeetingID, MemoIDs: [memoId] });
    if (res && res.added) toast('تم إدراج المذكرة في الجلسة الحالية بنجاح ✅');
    else toast('تم حفظ المذكرة، لكن تعذّر إدراجها في الجلسة الحالية.');
    clearMemoForm();
  } catch (e) {
    toast('خطأ: ' + (e && e.message ? e.message : 'حدث خطأ غير متوقع، جرّب مرة أخرى.'));
  } finally {
    btn.disabled = false;
    btn.textContent = 'إدراج المذكرة في الجلسة الحالية';
  }
}

loadOrganizations().then(loadMemosList).catch(e => toast('خطأ في التحميل: ' + e.message));

if (API.hasPermission('ManageMeetings')) {
  document.getElementById('insertBtn').style.display = 'inline-block';
  document.getElementById('insertHint').style.display = 'block';
}
document.getElementById('memoSearch').addEventListener('input', renderMemos);
</script>
<div style="text-align:center;padding:20px;color:#4B5768;font-size:12px;margin-top:40px;border-top:1px solid #E2E5EA;">تصميم وتنفيذ أحمد أسامة حميده</div>
</body>
</html>
