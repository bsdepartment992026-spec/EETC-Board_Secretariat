<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قرارات الجلسة — نظام دورة العمل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Markazi+Text:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1B2A41; --ink-soft:#4B5768; --paper:#F3F4F6; --surface:#fff;
          --accent:#A6802E; --accent-soft:#F3ECDC; --line:#E2E5EA; --success:#1F7A4D; --danger:#B23A3A; }
  * { box-sizing:border-box; }
  body { font-family:'Cairo', sans-serif; background:var(--paper); margin:0; color:var(--ink); }
  .wrap { max-width:1200px; margin:0 auto; padding:24px; }

  h2 { font-family:'Markazi Text', serif; font-size:22px; margin:0 0 4px; }
  .lead { font-size:12.5px; color:var(--ink-soft); margin:0 0 16px; }

  .panel { background:var(--surface); border:1px solid var(--line); border-radius:6px; overflow:hidden; margin-bottom:16px; }

  .toolbar { display:flex; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); align-items:center; flex-wrap:wrap; background:#FAFAF9; }
  .toolbar .grow { flex:1; }
  .toolbar select.field { padding:7px 9px; border:1px solid var(--line); border-radius:5px; font-family:inherit; font-size:12.5px; background:#fff; }
  .badge { font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:20px; }
  .badge.draft { background:var(--accent-soft); color:#8C6C25; }
  .badge.ok { background:#E4F1EA; color:var(--success); }

  button { font-family:inherit; cursor:pointer; border:none; border-radius:5px; font-size:12.5px; font-weight:600; padding:8px 14px; }
  button.primary { background:var(--ink); color:#fff; } button.primary:hover { background:#0F1A2C; }
  button.accent { background:var(--accent); color:#fff; } button.accent:hover { background:#8C6C25; }
  button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); } button.ghost:hover { background:var(--paper); }
  button.small { padding:6px 11px; font-size:12px; }
  button:disabled { opacity:.55; cursor:default; }

  .table-scroll { overflow-x:auto; }
  table.grid { width:100%; border-collapse:collapse; font-size:13px; min-width:900px; table-layout:fixed; }
  table.grid th { text-align:right; font-size:11.5px; color:var(--ink-soft); font-weight:600; padding:9px 8px; border-bottom:1px solid var(--line); background:#fff; position:sticky; top:0; z-index:1; }
  table.grid td { padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.grid tr:last-child td { border-bottom:none; }
  th.c, td.c { width:58px; text-align:center; white-space:nowrap; }
  th.sub, td.sub { width:230px; }
  th.e, td.e { width:165px; }
  th.n, td.n { width:190px; }
  th.st, td.st { width:120px; }
  td select.status { width:100%; border:1px solid var(--line); border-radius:5px; padding:7px 8px; font-family:inherit; font-size:12.5px; background:#fff; }
  td select.status:focus { outline:none; border-color:var(--accent); }
  td.sub .subj { font-size:12.5px; line-height:1.6; max-height:120px; overflow-y:auto; padding-inline-end:4px; }
  td.muted { color:var(--ink-soft); }
  td textarea { width:100%; height:92px; resize:vertical; overflow-y:auto; border:1px solid var(--line); border-radius:5px; padding:7px 8px; font-family:'Times New Roman', serif; font-size:14px; line-height:1.5; color:var(--ink); }
  td textarea:focus, td input:focus, .toolbar select.field:focus { outline:none; border-color:var(--accent); }
  td input.note { width:100%; border:1px solid var(--line); border-radius:5px; padding:7px 8px; font-family:inherit; font-size:12.5px; }
  .exec-btn { width:100%; text-align:right; background:#fff; border:1px dashed var(--line); color:var(--ink-soft); font-weight:500; padding:7px 9px; border-radius:5px; font-size:12px; white-space:normal; }
  .exec-btn.has { border-style:solid; color:var(--ink); }
  .empty { padding:30px 18px; text-align:center; color:var(--ink-soft); font-size:13px; }

  /* المحرّر المنسّق */
  .rt-toolbar { display:flex; gap:4px; padding:8px 14px; border-bottom:1px solid var(--line); background:#F7F7F5; flex-wrap:wrap; align-items:center; }
  .rt-toolbar button { background:#fff; border:1px solid var(--line); color:var(--ink); padding:5px 9px; font-size:12px; border-radius:4px; font-weight:600; min-width:30px; }
  .rt-toolbar button:hover { background:var(--paper); }
  .rt-toolbar select, .rt-toolbar input[type=color] { border:1px solid var(--line); border-radius:4px; background:#fff; font-family:inherit; font-size:12px; padding:3px 5px; height:29px; }
  .rt-toolbar input[type=color] { width:34px; padding:2px; }
  .rt-toolbar .rt-sep { width:1px; height:20px; background:var(--line); margin:0 4px; }
  .rt-toolbar .rt-lbl { font-size:11px; color:var(--ink-soft); }
  td .editor { min-height:92px; max-height:360px; overflow:auto; border:1px solid var(--line); border-radius:5px; padding:8px 9px; font-family:'Times New Roman', serif; font-size:14px; line-height:1.65; background:#fff; direction:rtl; text-align:right; }
  td .editor:focus { outline:none; border-color:var(--accent); }
  td .editor[contenteditable]:empty:before { content:attr(data-ph); color:#9aa3af; }
  td .editor table { border-collapse:collapse; width:100%; margin:4px 0; }
  td .editor table td, td .editor table th { border:1px solid #999; padding:4px 6px; vertical-align:top; }
  td .editor ul, td .editor ol { margin:4px 22px 4px 0; padding:0; }

  .docs { padding:12px 14px; border-top:1px solid var(--line); background:#FAFAF9; font-size:12.5px; }
  .docs h4 { margin:0 0 8px; font-size:13px; }
  .docs a { color:var(--ink); text-decoration:none; border-bottom:1px dotted var(--ink-soft); margin-inline-end:14px; display:inline-block; margin-bottom:6px; }

  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 20px; border-radius:5px; font-size:13px; display:none; z-index:40; max-width:90%; text-align:center; }

  /* Modal */
  .backdrop { position:fixed; inset:0; background:rgba(27,42,65,.45); display:none; align-items:center; justify-content:center; z-index:30; padding:16px; }
  .backdrop.show { display:flex; }
  .modal { background:#fff; border-radius:8px; width:100%; max-width:420px; max-height:85vh; display:flex; flex-direction:column; overflow:hidden; }
  .modal-head { padding:12px 14px; border-bottom:1px solid var(--line); font-weight:600; font-size:13.5px; }
  .modal-head span { color:var(--ink-soft); font-weight:400; font-size:12px; }
  .modal-body { padding:10px 14px; overflow:auto; }
  .modal-body label { display:flex; align-items:center; gap:8px; padding:7px 4px; font-size:13px; border-bottom:1px solid #F1F2F4; }
  .modal-body label:last-child { border-bottom:none; }
  .modal-body input[type=checkbox] { width:16px; height:16px; accent-color:var(--accent); }
  .modal-foot { padding:10px 14px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; background:#FAFAF9; }

  @media (max-width:700px) {
    .wrap { padding:16px 12px; }
    h2 { font-size:19px; }
    .toolbar { padding:10px; gap:6px; }
    .toolbar select.field { width:100%; }
    .toolbar button { flex:1; }
    .toolbar .grow { display:none; }
  }
</style>
</head>
<body>
  <div class="topbar"><div class="brand">✅ القرارات</div><div class="top-nav"></div></div>

  <div class="wrap">
    <h2>قرارات الجلسة</h2>

    <div class="panel">
      <div class="toolbar">
        <select class="field" id="meetingSel" onchange="onMeetingChange()"></select>
        <span class="badge draft" id="statusBadge">مسودة</span>
        <span class="grow"></span>
        <select class="field" id="phraseSel" onchange="insertPhrase()" title="جمل القرارات الجاهزة"></select>
        <button class="ghost" onclick="saveAll(false)">💾 حفظ</button>
        <button class="ghost" onclick="openPrintDecisions()">🖨️ طباعة القرارات</button>
        <button class="accent" id="approveBtn" onclick="approve()">✅ اعتماد قرارات الجلسة</button>
        <button class="ghost" id="uploadBtn" onclick="document.getElementById('fileInput').click()">📎 رفع ملف القرارات المعتمد</button>
        <input type="file" id="fileInput" accept="application/pdf" style="display:none" onchange="onFilePick(this)">
      </div>

      <div class="rt-toolbar" id="rtToolbar">
        <span class="rt-lbl">تنسيق القرار المحدّد:</span>
        <button type="button" title="غامق" onmousedown="return false" onclick="rtCmd('bold')"><b>B</b></button>
        <button type="button" title="مائل" onmousedown="return false" onclick="rtCmd('italic')"><i>I</i></button>
        <button type="button" title="تسطير" onmousedown="return false" onclick="rtCmd('underline')"><u>U</u></button>
        <select title="حجم الخط" onmousedown="return false" onchange="rtSize(this)">
          <option value="">الحجم</option>
          <option value="11pt">11</option>
          <option value="12pt">12</option>
          <option value="14pt">14</option>
          <option value="16pt">16</option>
          <option value="18pt">18</option>
          <option value="22pt">22</option>
        </select>
        <input type="color" title="لون النص" value="#1b2a41" onmousedown="return false" onchange="rtColor(this)">
        <span class="rt-sep"></span>
        <button type="button" title="محاذاة يمين" onmousedown="return false" onclick="rtCmd('justifyRight')">⇥</button>
        <button type="button" title="توسيط" onmousedown="return false" onclick="rtCmd('justifyCenter')">↔</button>
        <button type="button" title="محاذاة يسار" onmousedown="return false" onclick="rtCmd('justifyLeft')">⇤</button>
        <button type="button" title="ضبط" onmousedown="return false" onclick="rtCmd('justifyFull')">≡</button>
        <span class="rt-sep"></span>
        <button type="button" title="قائمة نقطية" onmousedown="return false" onclick="rtCmd('insertUnorderedList')">• قائمة</button>
        <button type="button" title="قائمة رقمية" onmousedown="return false" onclick="rtCmd('insertOrderedList')">1. قائمة</button>
        <span class="rt-sep"></span>
        <button type="button" title="إدراج جدول" onmousedown="return false" onclick="rtInsertTable()">▦ جدول</button>
        <button type="button" title="إضافة صف أسفل" onmousedown="return false" onclick="rtTableRow(false)">+صف</button>
        <button type="button" title="حذف صف" onmousedown="return false" onclick="rtTableRow(true)">-صف</button>
        <button type="button" title="إضافة عمود" onmousedown="return false" onclick="rtTableCol(false)">+عمود</button>
        <button type="button" title="حذف عمود" onmousedown="return false" onclick="rtTableCol(true)">-عمود</button>
        <button type="button" title="حذف الجدول" onmousedown="return false" onclick="rtTableDel()">🗑 جدول</button>
      </div>

      <div class="table-scroll">
        <table class="grid">
          <thead><tr>
            <th class="c">رقم المذكرة</th>
            <th class="sub">الموضوع</th>
            <th>القرار</th>
            <th class="e">جهة التنفيذ</th>
            <th class="n">ملاحظات</th>
            <th class="st">حالة القرار</th>
          </tr></thead>
          <tbody id="rows"><tr><td colspan="6" class="empty">جارٍ التحميل...</td></tr></tbody>
        </table>
      </div>

      <div class="docs" id="docs" style="display:none"></div>
    </div>
  </div>

  <div class="backdrop" id="execModal">
    <div class="modal">
      <div class="modal-head">جهة التنفيذ <span id="execSubject"></span></div>
      <div class="modal-body" id="execList"></div>
      <div class="modal-foot">
        <button class="ghost small" onclick="closeExec()">إلغاء</button>
        <button class="primary small" onclick="saveExec()">تم</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="js/api.js"></script>
<script src="js/arabic.js"></script>
<script src="js/nav.js"></script>
<script>
API.requireLogin();
renderTopNav('decisions');
if (!API.hasPermission('ManageDecisions')) {
  alert('ليس لديك صلاحية الوصول لهذه الصفحة');
  window.location.href = 'index.html';
}

const S = { meetings: [], meetingId: '', meeting: null, items: [], orgs: [], phrases: [], statuses: [], execMap: {}, approved: false };
const E = AR.esc;
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
function toAr(v) { return String(v == null ? '' : v).replace(/[0-9]/g, d => AR_DIGITS[+d]); }
let execTarget = null;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 3000);
}
async function run(fn) { try { await fn(); } catch (e) { toast('خطأ: ' + e.message); } }

function subjectOf(it) {
  if (it.MemoID) return it.Subject || '';
  let s = AR.composeSpecial(it.SpecialTemplate || '', { SessionNumber: it.RefSessionNumber, SessionDate: it.RefSessionDate });
  return (s || '').replace(/\s*0\s*$/, '').trim() || it.SpecialLabel || '';
}

function meetingLabel(m) {
  const d = toAr(AR.formatDate(m.SessionDate));
  if (m.SessionNumber != null) return 'الجلسة ' + toAr(m.SessionNumber) + ' — ' + d;
  return 'جلسة ' + d;
}

/* ---------------- التهيئة ---------------- */
async function loadMeetings() {
  S.meetings = await API.call('listMeetings');
  if (!S.meetings.length) {
    document.getElementById('rows').innerHTML = '<tr><td colspan="6" class="empty">لا توجد جلسات بعد. أنشئ جلسة واعتمد رولها أولًا.</td></tr>';
    return;
  }
  const sel = document.getElementById('meetingSel');
  sel.innerHTML = S.meetings.map(m => `<option value="${E(m.MeetingID)}">${E(meetingLabel(m))}</option>`).join('');
  await loadMeeting(S.meetings[0].MeetingID);
}

async function onMeetingChange() {
  await loadMeeting(document.getElementById('meetingSel').value);
}

async function loadMeeting(id) {
  S.meetingId = id;
  const res = await API.call('getDecisionsForMeeting', { MeetingID: id });
  S.meeting = res.meeting;
  S.orgs = res.orgs || [];
  S.phrases = res.phrases || [];
  S.statuses = res.statuses || [];
  S.approved = !!res.approved;

  S.items = (res.items || []).map(it => {
    it._subject = subjectOf(it);
    return it;
  });
  S.execMap = {};
  S.items.forEach(it => { S.execMap[it.RollItemID] = (it.ExecutingEntityIDs || []).slice(); });

  renderPhrases();
  render();
  renderStatus();
  renderDocs(res.docs || []);
}

function renderStatus() {
  const b = document.getElementById('statusBadge');
  if (S.approved) { b.className = 'badge ok'; b.textContent = 'معتمد'; }
  else { b.className = 'badge draft'; b.textContent = 'مسودة'; }
}

function renderPhrases() {
  const sel = document.getElementById('phraseSel');
  sel.innerHTML = '<option value="">— جمل القرارات الجاهزة —</option>' +
    S.phrases.map(p => `<option value="${E(p.ItemID)}">${E(p.Label || p.Value)}</option>`).join('');
}

/* ---------------- العرض ---------------- */
function render() {
  const box = document.getElementById('rows');
  if (!S.items.length) {
    box.innerHTML = '<tr><td colspan="6" class="empty">لا توجد بنود في رول هذه الجلسة.</td></tr>';
    return;
  }
  box.innerHTML = S.items.map(it => {
    const id = it.RollItemID;
    const num = (it.RollNumber === null || it.RollNumber === undefined) ? '—' : it.RollNumber;
    return `<tr data-roll="${E(id)}">
      <td class="c">${E(toAr(num))}</td>
      <td class="sub"><div class="subj">${E(it._subject)}</div></td>
      <td><div class="editor" contenteditable="true" id="dec-${E(id)}" data-ph="اكتب نص القرار..."></div></td>
      <td class="e"><button type="button" class="exec-btn" id="execbtn-${E(id)}" onclick="openExec('${E(id)}')"></button></td>
      <td class="n"><input class="note" id="note-${E(id)}" value="${E(it.ExecNote)}" placeholder="ملاحظات"></td>
      <td class="st"><select class="status" id="st-${E(id)}">${statusOptions(it.StatusID)}</select></td>
    </tr>`;
  }).join('');
  S.items.forEach(it => {
    const ed = document.getElementById('dec-' + it.RollItemID);
    if (ed) ed.innerHTML = blocksToHtml(parseDecisionData(it.DecisionData, it.DecisionText));
    updateExecBtn(it.RollItemID);
  });
}

function statusOptions(selId) {
  return '<option value="">—</option>' + S.statuses.map(s =>
    `<option value="${E(s.ItemID)}" ${s.ItemID === selId ? 'selected' : ''}>${E(s.Label)}</option>`).join('');
}

function orgName(orgId) {
  const o = S.orgs.find(x => x.OrgID === orgId);
  return o ? o.Name : orgId;
}
function updateExecBtn(rollId) {
  const btn = document.getElementById('execbtn-' + rollId);
  if (!btn) return;
  const ids = S.execMap[rollId] || [];
  if (ids.length) {
    btn.classList.add('has');
    const names = ids.map(orgName);
    btn.textContent = names.length <= 2 ? names.join('، ') : (names.slice(0, 2).join('، ') + ' +' + (names.length - 2));
  } else {
    btn.classList.remove('has');
    btn.textContent = 'اختر الجهات...';
  }
}

/* ---------------- جهة التنفيذ (نافذة) ---------------- */
function openExec(rollId) {
  execTarget = rollId;
  const it = S.items.find(x => x.RollItemID === rollId);
  document.getElementById('execSubject').textContent = '— ' + (it ? it._subject.slice(0, 60) : '');
  const chosen = S.execMap[rollId] || [];
  const list = document.getElementById('execList');
  if (!S.orgs.length) { list.innerHTML = '<div style="padding:10px;color:#4B5768;font-size:13px">لا توجد جهات في الإعدادات.</div>'; }
  else {
    list.innerHTML = S.orgs.map(o =>
      `<label><input type="checkbox" value="${E(o.OrgID)}" ${chosen.indexOf(o.OrgID) !== -1 ? 'checked' : ''}> ${E(o.Name)}</label>`
    ).join('');
  }
  document.getElementById('execModal').classList.add('show');
}
function closeExec() { document.getElementById('execModal').classList.remove('show'); execTarget = null; }
function saveExec() {
  if (!execTarget) return;
  const ids = Array.from(document.querySelectorAll('#execList input:checked')).map(c => c.value);
  S.execMap[execTarget] = ids;
  updateExecBtn(execTarget);
  closeExec();
}

/* ---------------- جمع البيانات ---------------- */
function collectItems() {
  return S.items.map(it => {
    const ed = document.getElementById('dec-' + it.RollItemID);
    const blocks = ed ? serializeEditor(ed) : [];
    return {
      RollItemID: it.RollItemID,
      MemoID: it.MemoID || '',
      DecisionNumber: it.RollNumber,
      Subject: it._subject,
      DecisionText: ed ? (ed.innerText || '').trim() : '',
      DecisionData: JSON.stringify(blocks),
      Notes: (document.getElementById('note-' + it.RollItemID) || {}).value || '',
      StatusID: (document.getElementById('st-' + it.RollItemID) || {}).value || '',
      ExecutingEntityIDs: S.execMap[it.RollItemID] || []
    };
  });
}

async function saveAll(silent) {
  const items = collectItems();
  await API.call('saveDecisions', { MeetingID: S.meetingId, items: items });
  if (!silent) toast('تم الحفظ ✅');
}

function insertPhrase() {
  const sel = document.getElementById('phraseSel');
  const p = S.phrases.find(x => x.ItemID === sel.value);
  sel.value = '';
  if (!p) return;
  const ed = lastEditor || document.querySelector('.editor');
  if (!ed) return;
  ed.focus();
  const text = p.Value || p.Label || '';
  document.execCommand('insertHTML', false, E(text).replace(/\n/g, '<br>'));
}

/* ================= المحرّر المنسّق (Bold/Underline/ألوان/جداول/قوائم) ================= */
let lastEditor = null, savedRange = null;

document.addEventListener('focusin', function (e) {
  if (e.target && e.target.classList && e.target.classList.contains('editor')) lastEditor = e.target;
});
document.addEventListener('selectionchange', function () {
  const sel = window.getSelection();
  if (sel && sel.rangeCount && lastEditor && lastEditor.contains(sel.getRangeAt(0).startContainer)) {
    savedRange = sel.getRangeAt(0).cloneRange();
  }
});
function restoreSel() {
  if (!lastEditor) return;
  lastEditor.focus();
  if (savedRange) { const sel = window.getSelection(); sel.removeAllRanges(); try { sel.addRange(savedRange); } catch (e) { } }
}
function rtCmd(cmd) {
  if (!lastEditor) { toast('اختر مربع قرار أولاً'); return; }
  restoreSel();
  document.execCommand(cmd, false, null);
}
function rtSize(sel) { const v = sel.value; sel.value = ''; if (v) rtWrapStyle('font-size', v); }
function rtColor(inp) { const v = inp.value; if (v) rtWrapStyle('color', v); }
function rtWrapStyle(prop, value) {
  if (!lastEditor) { toast('اختر مربع قرار أولاً'); return; }
  restoreSel();
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  if (range.collapsed) { toast('حدّد نصًا أولًا'); return; }
  const span = document.createElement('span');
  span.style[prop] = value;
  try { range.surroundContents(span); }
  catch (e) { const frag = range.extractContents(); span.appendChild(frag); range.insertNode(span); }
  sel.removeAllRanges();
  const r = document.createRange(); r.selectNodeContents(span); sel.addRange(r);
  savedRange = sel.getRangeAt(0).cloneRange();
}
function currentEditorCell() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return null;
  let n = sel.getRangeAt(0).startContainer;
  while (n && n !== lastEditor) {
    if (n.nodeType === 1 && (n.tagName === 'TD' || n.tagName === 'TH')) return n;
    n = n.parentNode;
  }
  return null;
}
function rtInsertTable() {
  if (!lastEditor) { toast('اختر مربع قرار أولاً'); return; }
  const dims = prompt('عدد الصفوف × الأعمدة (مثال: 3x4)', '3x4');
  if (!dims) return;
  const m = /^\s*(\d+)\s*[x×,]\s*(\d+)\s*$/.exec(dims);
  if (!m) { toast('صيغة غير صحيحة. مثال: 3x4'); return; }
  const rows = Math.min(50, Math.max(1, +m[1])), cols = Math.min(15, Math.max(1, +m[2]));
  let html = '<table><tbody>';
  for (let i = 0; i < rows; i++) { html += '<tr>'; for (let j = 0; j < cols; j++) html += '<td><br></td>'; html += '</tr>'; }
  html += '</tbody></table><p><br></p>';
  restoreSel();
  document.execCommand('insertHTML', false, html);
}
function rtTableRow(del) {
  const cell = currentEditorCell();
  if (!cell) { toast('ضع المؤشر داخل جدول'); return; }
  const tr = cell.parentNode, table = tr.closest('table');
  if (del) {
    if (table.querySelectorAll('tr').length <= 1) { table.remove(); return; }
    tr.remove(); return;
  }
  const nt = document.createElement('tr');
  for (let i = 0; i < tr.children.length; i++) { const td = document.createElement('td'); td.innerHTML = '<br>'; nt.appendChild(td); }
  tr.parentNode.insertBefore(nt, tr.nextSibling);
}
function rtTableCol(del) {
  const cell = currentEditorCell();
  if (!cell) { toast('ضع المؤشر داخل جدول'); return; }
  const tr = cell.parentNode, table = tr.closest('table');
  const idx = Array.prototype.indexOf.call(tr.children, cell);
  const rows = Array.from(table.querySelectorAll('tr'));
  if (del) {
    if (tr.children.length <= 1) { table.remove(); return; }
    rows.forEach(r => { if (r.children[idx]) r.children[idx].remove(); });
    return;
  }
  rows.forEach(r => { const td = document.createElement('td'); td.innerHTML = '<br>'; const ref = r.children[idx]; r.insertBefore(td, ref ? ref.nextSibling : null); });
}
function rtTableDel() {
  const cell = currentEditorCell();
  if (!cell) { toast('ضع المؤشر داخل جدول'); return; }
  const table = cell.closest('table');
  if (table) table.remove();
}

/* ---- لصق من Word/Excel مع الاحتفاظ بالجداول والتنسيق ---- */
const RT_ALLOWED_TAGS = { B:1, STRONG:1, I:1, EM:1, U:1, S:1, SPAN:1, FONT:1, BR:1, P:1, DIV:1,
  H1:1, H2:1, H3:1, H4:1, H5:1, H6:1, UL:1, OL:1, LI:1, TABLE:1, THEAD:1, TBODY:1, TFOOT:1, TR:1, TD:1, TH:1 };
const RT_ALLOWED_STYLE = { color:1, 'font-size':1, 'font-weight':1, 'text-decoration':1, 'text-align':1, 'font-style':1, 'font-family':1 };
function rtCleanStyle(s) {
  return String(s).split(';').map(function (p) {
    const i = p.indexOf(':'); if (i < 0) return '';
    const k = p.slice(0, i).trim().toLowerCase(), v = p.slice(i + 1).trim();
    return (RT_ALLOWED_STYLE[k] && v) ? k + ':' + v : '';
  }).filter(Boolean).join(';');
}
function rtCleanNode(node) {
  Array.from(node.childNodes).forEach(function (ch) {
    if (ch.nodeType === 3) return;
    if (ch.nodeType !== 1) { ch.remove(); return; }
    const tag = ch.tagName;
    if (!RT_ALLOWED_TAGS[tag]) {
      const parent = ch.parentNode;
      while (ch.firstChild) parent.insertBefore(ch.firstChild, ch);
      ch.remove();
      rtCleanNode(parent);
      return;
    }
    Array.from(ch.attributes).forEach(function (a) {
      const n = a.name.toLowerCase();
      if (n === 'style') ch.setAttribute('style', rtCleanStyle(a.value));
      else if ((n === 'colspan' || n === 'rowspan') && (tag === 'TD' || tag === 'TH')) { /* keep */ }
      else ch.removeAttribute(a.name);
    });
    rtCleanNode(ch);
  });
}
function rtSanitizeHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  rtCleanNode(doc.body);
  return doc.body.innerHTML;
}
function rtOnPaste(e) {
  const ed = e.target.closest ? e.target.closest('.editor') : null;
  if (!ed) return;
  const html = e.clipboardData && e.clipboardData.getData('text/html');
  if (!html) return;
  e.preventDefault();
  lastEditor = ed;
  document.execCommand('insertHTML', false, rtSanitizeHtml(html));
}

/* ---- DOM -> نموذج البلوكات ---- */
function rtNormColor(v) {
  v = String(v || '').trim();
  let m = /^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i.exec(v);
  if (m) return '#' + [1, 2, 3].map(i => (+m[i]).toString(16).padStart(2, '0')).join('');
  if (/^#[0-9a-f]{6}$/i.test(v)) return v.toLowerCase();
  if (/^#[0-9a-f]{3}$/i.test(v)) return '#' + v[1] + v[1] + v[2] + v[2] + v[3] + v[3];
  return v;
}
function rtPxToPt(v) {
  v = String(v || '').trim().toLowerCase();
  let m = /^([\d.]+)\s*pt$/.exec(v); if (m) return Math.round(+m[1]);
  m = /^([\d.]+)\s*px$/.exec(v); if (m) return Math.round(+m[1] * 0.75);
  m = /^([\d.]+)\s*em$/.exec(v); if (m) return Math.round(+m[1] * 12);
  m = /^([\d.]+)$/.exec(v); if (m) return Math.round(+m[1]);
  return null;
}
function rtAlignOfEl(el) {
  const al = el.getAttribute && el.getAttribute('align');
  if (al) return String(al).toLowerCase();
  const ta = /text-align\s*:\s*([^;]+)/i.exec((el.getAttribute && el.getAttribute('style')) || '');
  if (ta) { const v = ta[1].trim().toLowerCase(); if (/^(right|center|left|justify)$/.test(v)) return v; }
  return '';
}
function rtMergeRuns(runs) {
  const out = [];
  runs.forEach(function (r) {
    if (!r.text) return;
    const last = out[out.length - 1];
    if (last && last.b === r.b && last.i === r.i && last.u === r.u && last.c === r.c && last.s === r.s) last.text += r.text;
    else out.push(Object.assign({}, r));
  });
  return out;
}
function rtSerializeInline(el, inherited) {
  inherited = inherited || {};
  const runs = [];
  Array.from(el.childNodes).forEach(function (node) {
    if (node.nodeType === 3) { if (node.nodeValue) runs.push(Object.assign({ text: node.nodeValue }, inherited)); return; }
    if (node.nodeType !== 1) return;
    const tag = node.tagName;
    const st = Object.assign({}, inherited);
    if (tag === 'B' || tag === 'STRONG') st.b = true;
    if (tag === 'I' || tag === 'EM') st.i = true;
    if (tag === 'U') st.u = true;
    if (tag === 'FONT') { const c = node.getAttribute('color'); if (c) st.c = rtNormColor(c); }
    const sty = node.getAttribute('style') || '';
    let m = /(?:^|;)\s*color\s*:\s*([^;]+)/i.exec(sty); if (m) st.c = rtNormColor(m[1]);
    m = /(?:^|;)\s*font-size\s*:\s*([^;]+)/i.exec(sty); if (m) { const p = rtPxToPt(m[1]); if (p) st.s = p; }
    m = /(?:^|;)\s*font-weight\s*:\s*([^;]+)/i.exec(sty); if (m && /bold|[6-9]00/i.test(m[1])) st.b = true;
    m = /(?:^|;)\s*text-decoration\s*:\s*([^;]+)/i.exec(sty); if (m && /underline/i.test(m[1])) st.u = true;
    if (tag === 'BR') { runs.push(Object.assign({ text: '\n' }, inherited)); return; }
    rtSerializeInline(node, st).forEach(function (r) { runs.push(r); });
  });
  return rtMergeRuns(runs);
}
function rtSplitRuns(runs, align) {
  const out = []; let cur = [];
  runs.forEach(function (r) {
    const parts = String(r.text).split('\n');
    parts.forEach(function (part, idx) {
      if (idx > 0) { out.push({ t: 'p', align: align || 'right', runs: cur }); cur = []; }
      if (part) cur.push(Object.assign({}, r, { text: part }));
    });
  });
  out.push({ t: 'p', align: align || 'right', runs: cur });
  return out.filter(function (b) { return b.runs.length; });
}
function rtHasBlockChild(el) {
  return Array.from(el.children).some(function (c) { return /^(TABLE|UL|OL|P|DIV|H[1-6])$/.test(c.tagName); });
}
function rtSerializeTable(table) {
  const rows = [];
  Array.from(table.children).forEach(function (sec) {
    let trs;
    if (sec.tagName === 'TR') trs = [sec];
    else if (sec.tagName === 'THEAD' || sec.tagName === 'TBODY' || sec.tagName === 'TFOOT') trs = Array.from(sec.children).filter(c => c.tagName === 'TR');
    else return;
    trs.forEach(function (tr) {
      const cells = [];
      Array.from(tr.children).forEach(function (td) {
        if (td.tagName !== 'TD' && td.tagName !== 'TH') return;
        let blocks = rtCollectBlocks(td);
        if (!blocks.length) blocks = [{ t: 'p', align: 'right', runs: [] }];
        const cell = { blocks: blocks };
        const cs = td.colSpan || (td.getAttribute && +td.getAttribute('colspan')) || 1;
        const rs = td.rowSpan || (td.getAttribute && +td.getAttribute('rowspan')) || 1;
        if (cs > 1) cell.colspan = cs;
        if (rs > 1) cell.rowspan = rs;
        cells.push(cell);
      });
      if (cells.length) rows.push(cells);
    });
  });
  return { t: 'table', rows: rows };
}
function rtCollectBlocks(root) {
  const blocks = [];
  Array.from(root.childNodes).forEach(function (node) {
    if (node.nodeType === 3) {
      const txt = node.nodeValue;
      if (txt && txt.replace(/\s/g, '') !== '') blocks.push({ t: 'p', align: 'right', runs: [{ text: txt }] });
      return;
    }
    if (node.nodeType !== 1) return;
    const tag = node.tagName;
    if (tag === 'TABLE') { blocks.push(rtSerializeTable(node)); return; }
    if (tag === 'UL' || tag === 'OL') {
      const ordered = tag === 'OL';
      Array.from(node.children).forEach(function (li) {
        if (li.tagName !== 'LI') return;
        blocks.push({ t: 'li', ordered: ordered, runs: rtSerializeInline(li) });
      });
      return;
    }
    if (tag === 'BR') { return; }
    if (tag === 'P' || tag === 'DIV' || /^H[1-6]$/.test(tag)) {
      if (rtHasBlockChild(node)) { rtCollectBlocks(node).forEach(function (b) { blocks.push(b); }); return; }
      rtSplitRuns(rtSerializeInline(node), rtAlignOfEl(node) || 'right').forEach(function (b) { blocks.push(b); });
      return;
    }
    rtSplitRuns(rtSerializeInline(node), 'right').forEach(function (b) { blocks.push(b); });
  });
  return blocks;
}
function serializeEditor(root) { return rtCollectBlocks(root); }

/* ---- نموذج البلوكات -> HTML (للمحرّر والعرض والطباعة) ---- */
function parseDecisionData(json, plain) {
  if (json) { try { const b = JSON.parse(json); if (Array.isArray(b) && b.length) return b; } catch (e) { } }
  if (plain) return [{ t: 'p', align: 'right', runs: [{ text: String(plain) }] }];
  return [];
}
function runsToHtml(runs) {
  return (runs || []).map(function (r) {
    let txt = E(String(r.text == null ? '' : r.text)).replace(/\n/g, '<br>');
    if (!txt) return '';
    let inner = txt;
    if (r.b) inner = '<b>' + inner + '</b>';
    if (r.i) inner = '<i>' + inner + '</i>';
    if (r.u) inner = '<u>' + inner + '</u>';
    const st = [];
    if (r.c) st.push('color:' + r.c);
    if (r.s) st.push('font-size:' + r.s + 'pt');
    if (st.length) inner = '<span style="' + st.join(';') + '">' + inner + '</span>';
    return inner;
  }).join('');
}
function tableBlockToHtml(b) {
  let h = '<table><tbody>';
  (b.rows || []).forEach(function (cells) {
    h += '<tr>';
    (cells || []).forEach(function (c) {
      const cs = (c && c.colspan > 1) ? ' colspan="' + c.colspan + '"' : '';
      const rs = (c && c.rowspan > 1) ? ' rowspan="' + c.rowspan + '"' : '';
      h += '<td' + cs + rs + '>' + (blocksToHtml((c && c.blocks) || []) || '<br>') + '</td>';
    });
    h += '</tr>';
  });
  return h + '</tbody></table>';
}
function blocksToHtml(blocks) {
  let html = '', i = 0;
  blocks = blocks || [];
  while (i < blocks.length) {
    const b = blocks[i];
    if (b.t === 'li') {
      const ordered = !!b.ordered; let li = '';
      while (i < blocks.length && blocks[i].t === 'li' && !!blocks[i].ordered === ordered) {
        li += '<li>' + (runsToHtml(blocks[i].runs || []) || '<br>') + '</li>'; i++;
      }
      html += (ordered ? '<ol>' : '<ul>') + li + (ordered ? '</ol>' : '</ul>');
      continue;
    }
    if (b.t === 'table') { html += tableBlockToHtml(b); i++; continue; }
    const align = b.align ? ' style="text-align:' + b.align + '"' : '';
    html += '<p' + align + '>' + (runsToHtml(b.runs || []) || '<br>') + '</p>';
    i++;
  }
  return html;
}
function blocksToPlain(blocks) {
  const parts = [];
  (blocks || []).forEach(function (b) {
    if (b.t === 'table') { (b.rows || []).forEach(function (cells) { parts.push((cells || []).map(c => blocksToPlain((c && c.blocks) || [])).join('\t')); }); }
    else parts.push((b.runs || []).map(r => String(r.text || '')).join(''));
  });
  return parts.join('\n');
}

document.getElementById('rows').addEventListener('paste', rtOnPaste);

/* ---------------- الاعتماد والرفع ---------------- */
async function approve() {
  if (!confirm('سيتم اعتماد قرارات الجلسة وتوليد ملفات PDF (المجمّع + قرار لكل مذكرة). هل تريد المتابعة؟')) return;
  const btn = document.getElementById('approveBtn');
  btn.disabled = true; btn.textContent = 'جارٍ الاعتماد...';
  try {
    await saveAll(true);
    const res = await API.call('approveDecisions', { MeetingID: S.meetingId });
    toast('تم الاعتماد ✅ — ' + (res.perDecision ? res.perDecision.length : 0) + ' قرار');
    await loadMeeting(S.meetingId);
  } catch (e) {
    toast('خطأ: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '✅ اعتماد قرارات الجلسة';
  }
}

function onFilePick(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const r = new FileReader();
  r.onload = async function () {
    const b64 = String(r.result).split(',')[1];
    try {
      await API.call('uploadDecisionConsolidated', {
        MeetingID: S.meetingId, FileName: file.name, MimeType: file.type || 'application/pdf', Base64: b64
      });
      toast('تم رفع الملف ✅');
      loadDocs();
    } catch (e) { toast('خطأ: ' + e.message); }
  };
  r.readAsDataURL(file);
}

function renderDocs(docs) {
  const box = document.getElementById('docs');
  if (!docs || !docs.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
  const cons = docs.filter(d => d.OwnerType === 'Meeting');
  const per = docs.filter(d => d.OwnerType === 'Decision');
  let html = '<h4>مستندات القرارات</h4>';
  if (cons.length) html += '<div><strong>الملف المجمّع:</strong> ' +
    cons.map(d => `<a href="${E(d.Url)}" target="_blank">${E(d.FileName || 'قرارات الجلسة')}</a>`).join('') + '</div>';
  if (per.length) html += '<div style="margin-top:6px"><strong>قرارات المذكرات:</strong> ' +
    per.map(d => `<a href="${E(d.Url)}" target="_blank">${E(d.FileName || 'قرار')}</a>`).join('') + '</div>';
  box.innerHTML = html;
  box.style.display = 'block';
}

async function loadDocs() {
  const docs = await API.call('listDecisionDocs', { MeetingID: S.meetingId });
  renderDocs(docs);
}

run(loadMeetings);
