<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إجمالي المذكرات — نظام دورة العمل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Markazi+Text:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1B2A41; --ink-soft:#4B5768; --paper:#F3F4F6; --surface:#fff;
          --accent:#A6802E; --accent-soft:#F3ECDC; --line:#E2E5EA; --success:#1F7A4D; }
  * { box-sizing:border-box; }
  body { font-family:'Cairo', sans-serif; background:var(--paper); margin:0; color:var(--ink); }
  .wrap { max-width:820px; margin:0 auto; padding:24px; }

  h2 { font-family:'Markazi Text', serif; font-size:22px; margin:0 0 4px; }
  .lead { font-size:12.5px; color:var(--ink-soft); margin:0 0 16px; }

  .panel { background:var(--surface); border:1px solid var(--line); border-radius:6px; overflow:hidden; margin-bottom:20px; }
  .panel-toolbar { display:flex; gap:8px; padding:12px 14px; background:#FAFAF9; border-bottom:1px solid var(--line); flex-wrap:wrap; align-items:center; }
  .panel-toolbar .grow { flex:1; }
  .panel-toolbar label.selall { display:flex; align-items:center; gap:6px; font-size:12.5px; }
  .field { padding:7px 9px; border:1px solid var(--line); border-radius:5px; font-family:inherit; font-size:12.5px; background:#fff; }
  .empty { padding:30px 18px; text-align:center; color:var(--ink-soft); font-size:13px; }

  button { font-family:inherit; cursor:pointer; border:none; border-radius:5px; font-size:12.5px; font-weight:600; padding:8px 14px; }
  button.primary { background:var(--ink); color:#fff; } button.primary:hover { background:#0F1A2C; }
  button.accent { background:var(--accent); color:#fff; } button.accent:hover { background:#8C6C25; }
  button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); } button.ghost:hover { background:var(--paper); }
  button.small { padding:6px 11px; font-size:12px; }
  button:disabled { opacity:.5; cursor:default; }

  table { width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }
  th { text-align:right; font-size:11px; color:var(--ink-soft); font-weight:600; padding:9px 8px; border-bottom:1px solid var(--line); }
  td { padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:last-child td { border-bottom:none; }
  th.c, td.c { width:36px; text-align:center; }
  th.s, td.s { width:78px; text-align:center; }
  tr.group-row td { background:var(--accent-soft); color:var(--accent); font-weight:700; text-align:center; font-size:12.5px; }
  .pool-subj { font-size:13px; line-height:1.65; word-wrap:break-word; }
  .pool-meta { font-size:11px; color:var(--ink-soft); margin-top:3px; line-height:1.5; }
  .status-chip { font-size:11px; padding:2px 8px; border-radius:10px; background:#F3E9C6; color:#7A5E13; white-space:nowrap; display:inline-block; }
  .status-chip.new { background:#E3F1E9; color:var(--success); }
  .cnt { font-size:12.5px; color:var(--ink-soft); font-weight:400; }

  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 20px; border-radius:5px; font-size:13px; display:none; z-index:20; }

  @media (max-width:600px) {
    .wrap { padding:16px 12px; }
    h2 { font-size:19px; }
    .panel-toolbar { padding:10px; gap:6px; }
    .panel-toolbar .grow { display:none; }
    .panel-toolbar .field { width:100%; }
    .panel-toolbar button { flex:1; }
    table { font-size:12.5px; }
    th, td { padding:8px 6px; }
    th.c, td.c { width:30px; }
    th.s, td.s { width:62px; }
    .pool-subj { font-size:12.5px; }
    .pool-meta { font-size:10.5px; }
  }
</style>
</head>
<body>
  <div class="topbar"><div class="brand">📑 إجمالي المذكرات</div><div class="top-nav"></div></div>

  <div class="wrap">
    <h2 id="title">إجمالي المذكرات</h2>
    <p class="lead">كل المذكرات التي لم تدخل أي جلسة بعد. حدّد ما تريد ثم انقله إلى جلسة.</p>

    <div class="panel">
      <div class="panel-toolbar">
        <select class="field" id="meetSelect" title="الجلسة التي ستُنقل إليها المذكرات"></select>
        <label class="selall"><input type="checkbox" id="selectAllPool" onchange="toggleSelectAll(this)"> تحديد الكل</label>
        <span class="grow"></span>
        <button class="ghost small" onclick="printTotal()">🖨️ طباعة</button>
        <button class="primary small" onclick="transferSelected()">نقل المحدد</button>
        <button class="accent small" onclick="transferAll()">نقل الكل</button>
      </div>
      <table>
        <thead><tr>
          <th class="c"></th><th class="c">م</th><th>الموضوع</th><th class="s">الحالة</th>
        </tr></thead>
        <tbody id="poolRows"><tr><td colspan="4" class="empty">جارٍ التحميل...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="js/api.js"></script>
<script src="js/arabic.js"></script>
<script src="js/nav.js"></script>
<script>
API.requireLogin();
renderTopNav('pool');
if (!API.hasPermission('ManageMeetings')) {
  alert('ليس لديك صلاحية الوصول لهذه الصفحة');
  window.location.href = 'index.html';
}

const S = { pool: [], meetings: [] };
const E = AR.esc;
const selected = new Set();

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 2800);
}
async function run(fn) { try { await fn(); } catch (e) { toast('خطأ: ' + e.message); } }

/* ---------------- تحميل ---------------- */
async function loadAll() {
  const [pool, meetings] = await Promise.all([
    API.call('getAvailableMemosDetailed'),
    API.call('listMeetings')
  ]);
  S.pool = pool; S.meetings = meetings;
  const today = new Date();
  document.getElementById('title').textContent =
    `إجمالي المذكرات حتى ${AR.digits(today.getFullYear() + '/' + (today.getMonth() + 1) + '/' + today.getDate())}`;
  renderMeetOptions();
  renderPool();
}

function meetingLabel(m) {
  return m.SessionNumber
    ? `الجلسة ${m.SessionNumber} — ${AR.formatDate(m.SessionDate)}`
    : `جلسة جديدة — ${AR.formatDate(m.SessionDate)}`;
}
function renderMeetOptions() {
  const sel = document.getElementById('meetSelect');
  if (!S.meetings.length) { sel.innerHTML = '<option value="">لا توجد جلسات — أنشئ جلسة أولًا</option>'; return; }
  sel.innerHTML = S.meetings.map(m => `<option value="${E(m.MeetingID)}">${E(meetingLabel(m))}</option>`).join('');
}

/* ---------------- عرض الجدول ---------------- */
function renderPool() {
  const box = document.getElementById('poolRows');
  if (!S.pool.length) {
    box.innerHTML = '<tr><td colspan="4" class="empty">لا توجد مذكرات متاحة. سجّلها من شاشة "المذكرات".</td></tr>';
    return;
  }
  const groups = {}; const order = [];
  S.pool.forEach(m => {
    const key = m.OrgName || 'بدون جهة';
    if (!(key in groups)) { groups[key] = []; order.push(key); }
    groups[key].push(m);
  });

  let n = 0, html = '';
  order.forEach(orgName => {
    html += `<tr class="group-row"><td colspan="4">${E(orgName)}</td></tr>`;
    groups[orgName].forEach(m => {
      n++;
      const chip = m.DeferredFromSession
        ? `<span class="status-chip">${E(m.StatusLabel)}</span>`
        : `<span class="status-chip new">جديدة</span>`;
      const d = AR.formatDate(m.ChairmanOutgoingDate);
      const meta = [m.ChairmanOutgoingNo ? 'صادر رقم ' + E(m.ChairmanOutgoingNo) : '', d ? 'بتاريخ ' + d : '']
        .filter(Boolean);
      const metaHtml = meta.length ? `<div class="pool-meta">${meta.join(' · ')}</div>` : '';
      html += `<tr>
        <td class="c"><input type="checkbox" class="poolCheck" value="${m.MemoID}" ${selected.has(m.MemoID) ? 'checked' : ''} onchange="onPoolCheck(this)"></td>
        <td class="c">${n}</td>
        <td><div class="pool-subj">${E(m.Subject)}</div>${metaHtml}</td>
        <td class="s">${chip}</td>
      </tr>`;
    });
  });
  box.innerHTML = html;
}

function onPoolCheck(cb) { cb.checked ? selected.add(cb.value) : selected.delete(cb.value); }
function toggleSelectAll(master) {
  document.querySelectorAll('.poolCheck').forEach(cb => { cb.checked = master.checked; onPoolCheck(cb); });
}

/* ---------------- النقل إلى جلسة ---------------- */
function targetMeeting() { return document.getElementById('meetSelect').value; }

function transferSelected() {
  if (!selected.size) { toast('حدّد مذكرة واحدة على الأقل'); return; }
  const mid = targetMeeting();
  if (!mid) { toast('لا توجد جلسة. أنشئ جلسة أولًا من شاشة "الجلسات".'); return; }
  run(async () => {
    await API.call('addRollMemosBulk', { MeetingID: mid, MemoIDs: Array.from(selected) });
    selected.clear();
    document.getElementById('selectAllPool').checked = false;
    toast('تم نقل المذكرات المحددة إلى الجلسة');
    await refresh();
  });
}
function transferAll() {
  if (!S.pool.length) { toast('لا توجد مذكرات متاحة'); return; }
  const mid = targetMeeting();
  if (!mid) { toast('لا توجد جلسة. أنشئ جلسة أولًا من شاشة "الجلسات".'); return; }
  if (!confirm(`نقل كل المذكرات الـ ${S.pool.length} إلى الجلسة المحددة؟`)) return;
  run(async () => {
    await API.call('addRollMemosBulk', { MeetingID: mid, MemoIDs: S.pool.map(m => m.MemoID) });
    selected.clear();
    document.getElementById('selectAllPool').checked = false;
    toast('تم نقل كل المذكرات إلى الجلسة');
    await refresh();
  });
}
async function refresh() {
  S.pool = await API.call('getAvailableMemosDetailed');
  renderPool();
}
function printTotal() { window.open('total-print.html', '_blank'); }

run(loadAll);
</script>
<div style="text-align:center;padding:20px;color:#4B5768;font-size:12px;margin-top:40px;border-top:1px solid #E2E5EA;">تصميم وتنفيذ أحمد أسامة حميده</div>
</body>
</html>
