<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام دورة العمل - اختبار الاتصال</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background:#f5f6f8; margin:0; padding:40px 16px; }
  .card { max-width:480px; margin:0 auto; background:#fff; border-radius:10px; padding:28px;
          box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { font-size:20px; margin-top:0; }
  input { width:100%; padding:10px; margin:8px 0 16px; border:1px solid #ccc; border-radius:6px;
          box-sizing:border-box; font-family:inherit; }
  button { background:#1a73e8; color:#fff; border:none; padding:10px 20px; border-radius:6px;
           cursor:pointer; font-size:15px; }
  button:hover { background:#1558b0; }
  #result { margin-top:20px; padding:14px; border-radius:6px; white-space:pre-wrap;
            font-family:monospace; font-size:13px; display:none; }
  .ok { background:#e6f4ea; color:#1e7e34; border:1px solid #b7e1c1; }
  .err { background:#fdecea; color:#c0392b; border:1px solid #f5c6cb; }
</style>
</head>
<body>
  <div class="card">
    <h1>نظام دورة العمل — المرحلة 0: اختبار الاتصال</h1>
    <label>رابط Web App (من Apps Script Deploy):</label>
    <input id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <button onclick="testConnection()">اختبار الاتصال</button>
    <div id="result"></div>
  </div>

<script>
async function testConnection() {
  const url = document.getElementById('apiUrl').value.trim();
  const box = document.getElementById('result');
  box.style.display = 'block';
  box.className = '';
  box.textContent = 'جارٍ الاتصال...';
  if (!url) { box.className = 'err'; box.textContent = 'أدخل رابط Web App أولًا.'; return; }

  try {
    const res = await fetch(url);
    const data = await res.json();
    box.className = 'ok';
    box.textContent = JSON.stringify(data, null, 2);
  } catch (err) {
    box.className = 'err';
    box.textContent = 'فشل الاتصال: ' + err.message;
  }
}
</script>
</body>
</html>
